# SPDX-License-Identifier: MIT
#
# Publication automatique : pousser un tag `v1.2.3` construit, teste, signe
# et publie l'APK dans une GitHub Release.
#
# Secrets attendus (Settings > Secrets and variables > Actions) :
#   RELEASE_KEYSTORE_BASE64   keystore .jks encodé en base64
#   RELEASE_KEYSTORE_PASSWORD mot de passe du keystore
#   RELEASE_KEY_ALIAS         alias de la clé
#   RELEASE_KEY_PASSWORD      mot de passe de la clé
# Sans ces secrets, l'APK de release est publié NON signé (installable après signature manuelle).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Préparer la signature
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Nommer l'APK et calculer l'empreinte
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="calculator-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_OUT }}
            ${{ env.APK_OUT }}.sha256
          generate_release_notes: true
