# SPDX-License-Identifier: MIT
#
# Release automatique de l'APK.
#
# - Chaque fusion sur `main` qui touche l'application publie une nouvelle version
#   (v1.0.<numéro d'exécution>) dans les GitHub Releases : APK signé + empreinte SHA-256.
# - Lancement manuel possible depuis l'onglet Actions (« Run workflow »).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   RELEASE_KEYSTORE_BASE64   keystore .jks encodé en base64
#   RELEASE_KEYSTORE_PASSWORD mot de passe du keystore
#   RELEASE_KEY_ALIAS         alias de la clé
#   RELEASE_KEY_PASSWORD      mot de passe de la clé
# Toujours la MÊME clé : sinon les téléphones refusent d'installer la mise à jour.
name: Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier la release (décocher pour un simple essai)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Secrets de signature manquants : un APK non signé ne s'installe pas. Ajoutez RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS et RELEASE_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build de l'APK de release (minifié, signé)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Vérifier la signature et préparer les fichiers
        run: |
          set -o pipefail
          ls -la app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1 || true)
          if [ -z "$APK" ]; then echo "::error::APK signé introuvable"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          echo "APK : $APK"
          echo "apksigner : ${BT}apksigner"
          if ! "${BT}apksigner" verify --verbose --print-certs "$APK" > certs.txt 2>&1; then
            cat certs.txt
            echo "::error::La signature de l'APK n'est pas valide"
            exit 1
          fi
          grep -E "Verified using|certificate (DN|SHA-256)" certs.txt || cat certs.txt
          OUT="calculator-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Garder l'APK (essai sans publication)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: apk-essai
          path: |
            ${{ env.APK_OUT }}
            ${{ env.APK_OUT }}.sha256

      - name: Publier la release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Version ${{ env.VERSION_NAME }}
          generate_release_notes: true
          body: |
            APK signé, prêt à installer. Vérifiez l'empreinte SHA-256 avant l'installation :
            `sha256sum ${{ env.APK_OUT }}` doit afficher la valeur du fichier `.sha256`.
          files: |
            ${{ env.APK_OUT }}
            ${{ env.APK_OUT }}.sha256
